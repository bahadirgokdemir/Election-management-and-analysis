<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secim 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: #0a0f1a;
      background-image:
        radial-gradient(ellipse at top, #1e3a5f 0%, transparent 50%),
        radial-gradient(ellipse at bottom, #1a1a2e 0%, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-container {
      width: 100%;
      max-width: 420px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow:
        0 20px 50px rgba(59, 130, 246, 0.4),
        0 0 0 1px rgba(255,255,255,0.1);
    }

    .logo-box svg {
      width: 48px;
      height: 48px;
      color: white;
    }

    .app-title {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .app-subtitle {
      font-size: 16px;
      color: #94a3b8;
    }

    /* Main Card */
    .main-card {
      background: linear-gradient(145deg, #1e293b 0%, #1a2332 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .card-icon {
      width: 56px;
      height: 56px;
      background: rgba(59, 130, 246, 0.15);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .card-icon svg {
      width: 28px;
      height: 28px;
      color: #60a5fa;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
    }

    /* Form */
    .code-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper {
      position: relative;
    }

    .code-input {
      width: 100%;
      padding: 20px 24px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 4px;
      text-align: center;
      text-transform: uppercase;
      border: 2px solid #334155;
      border-radius: 16px;
      background: #0f172a;
      color: #ffffff;
      transition: all 0.3s;
    }

    .code-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow:
        0 0 0 4px rgba(59, 130, 246, 0.2),
        0 0 30px rgba(59, 130, 246, 0.1);
    }

    .code-input::placeholder {
      color: #475569;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 400;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      padding: 20px 32px;
      font-size: 17px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: #475569;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #334155, transparent);
    }

    .divider span {
      padding: 0 16px;
    }

    /* Admin Link */
    .admin-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      font-size: 15px;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(255,255,255,0.03);
      border: 1px solid #334155;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.3s;
    }

    .admin-btn:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.06);
      border-color: #475569;
    }

    .admin-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Footer */
    .footer {
      margin-top: 40px;
      text-align: center;
      color: #475569;
      font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .logo-box {
        width: 76px;
        height: 76px;
      }

      .logo-box svg {
        width: 40px;
        height: 40px;
      }

      .app-title {
        font-size: 28px;
      }

      .main-card {
        padding: 24px;
      }

      .code-input {
        padding: 18px 20px;
        font-size: 18px;
        letter-spacing: 3px;
      }

      .submit-btn {
        padding: 18px 24px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="header">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="app-title">Secim 2026</h1>
      <p class="app-subtitle">Oy Durumu Takip Sistemi</p>
    </div>

    <div class="main-card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
        </div>
        <h2 class="card-title">Oy Durumu Sorgula</h2>
        <p class="card-desc">Erisim kodunuzu girerek muvekkillerinizin oy durumlarini anlik olarak takip edin.</p>
      </div>

      <form action="{% url 'lawyer_voting_check' %}" method="post" class="code-form">
        {% csrf_token %}
        <div class="input-wrapper">
          <input
            type="text"
            name="code"
            class="code-input"
            placeholder="Erisim Kodu"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="20"
            required
            autofocus
          />
        </div>
        <button type="submit" class="submit-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          Sorgula
        </button>
      </form>

      <div class="divider">
        <span>veya</span>
      </div>

      <a href="{% url 'auth_login' %}" class="admin-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
        Yonetici Paneli
      </a>
    </div>

    <div class="footer">
      Secim 2026 - Oy Takip Sistemi
    </div>
  </div>
</body>
</html>
