<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seçim 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #475569;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      min-height: 100vh;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    /* Logo ve Baslik */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
    }

    .logo svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Kod Giris Karti */
    .code-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }

    .code-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .code-card-title svg {
      width: 22px;
      height: 22px;
      color: var(--primary);
    }

    .code-card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .code-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .code-input {
      width: 100%;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--bg-input);
      color: var(--text-primary);
      transition: all 0.2s;
    }

    .code-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .code-input::placeholder {
      color: var(--text-muted);
      letter-spacing: 0;
      text-transform: none;
      font-weight: 400;
    }

    .code-btn {
      width: 100%;
      padding: 18px 24px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .code-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }

    .code-btn:active {
      transform: translateY(0);
    }

    .code-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Hata Mesaji */
    .error-box {
      padding: 14px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .error-box svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--error);
    }

    /* Yonetici Girisi */
    .admin-section {
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }

    .admin-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .admin-link:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.05);
    }

    .admin-link svg {
      width: 18px;
      height: 18px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Mobil Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 20px 16px;
      }

      .title {
        font-size: 24px;
      }

      .code-card {
        padding: 24px 20px;
      }

      .code-input {
        padding: 16px;
        font-size: 16px;
      }

      .code-btn {
        padding: 16px 20px;
      }
    }

    /* Tablet ve Desktop */
    @media (min-width: 768px) {
      .container {
        padding: 40px 24px;
      }

      .logo {
        width: 80px;
        height: 80px;
      }

      .logo svg {
        width: 44px;
        height: 44px;
      }

      .title {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
        </svg>
      </div>
      <h1 class="title">Seçim 2026</h1>
      <p class="subtitle">Secim gunu oy durumu takip sistemi</p>
    </div>

    <div class="code-card">
      <h2 class="code-card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
        Erisim Kodu ile Giris
      </h2>
      <p class="code-card-desc">
        Size verilen erisim kodunu girerek muvekkillerinizin oy durumlarini goruntuleyebilirsiniz.
      </p>

      <form action="{% url 'lawyer_voting_check' %}" method="post" class="code-form">
        {% csrf_token %}
        <input
          type="text"
          name="code"
          class="code-input"
          placeholder="Erisim kodunuzu girin"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          required
          autofocus
        />
        <button type="submit" class="code-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Oy Durumlarini Kontrol Et
        </button>
      </form>
    </div>

    <div class="admin-section">
      <a href="{% url 'auth_login' %}" class="admin-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        Yonetici Girisi
      </a>
    </div>
  </div>

  <div class="footer">
    Seçim 2026
  </div>
</body>
</html>
