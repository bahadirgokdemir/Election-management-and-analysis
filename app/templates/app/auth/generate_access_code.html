{% extends 'app/base.html' %}

{% block title %}Erisim Kodu Olustur{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-content">
    <h1>Erisim Kodu Olustur</h1>
    <p class="subtitle">Avukatlar icin oy durumu kontrol kodu olusturun</p>
  </div>
  <a href="{% url 'auth_access_codes' %}" class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    </svg>
    Kodlara Don
  </a>
</div>

<div class="card" style="max-width: 600px;">
  <form method="post" class="form-vertical">
    {% csrf_token %}

    <div class="form-group">
      <label for="lawyer_id" class="form-label">Avukat *</label>
      <select id="lawyer_id" name="lawyer_id" class="form-select" required>
        <option value="">-- Avukat Secin --</option>
        {% for lawyer in lawyers %}
        <option value="{{ lawyer.id }}">{{ lawyer.ad }} {{ lawyer.soyad }} ({{ lawyer.sicil_no }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="election_id" class="form-label">Secim *</label>
      <select id="election_id" name="election_id" class="form-select" required>
        <option value="">-- Secim Secin --</option>
        {% for election in elections %}
        <option value="{{ election.id }}">{{ election.name }} ({{ election.election_date }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="expires_days" class="form-label">Gecerlilik Suresi (Gun)</label>
      <input type="number" id="expires_days" name="expires_days" class="form-input" value="30" min="1" max="365" />
      <small class="form-help">Kod olusturulduktan sonra kac gun gecerli olacak?</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 4v16m8-8H4"/>
        </svg>
        Kod Olustur
      </button>
      <a href="{% url 'auth_access_codes' %}" class="btn">Iptal</a>
    </div>
  </form>
</div>
{% endblock %}
