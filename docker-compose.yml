version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: avukat_pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avukat_list}
      POSTGRES_USER: ${POSTGRES_USER:-avukat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avukat_pass}
    ports:
    - "${POSTGRES_PORT:-5432}:5432"
    volumes:
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avukat_user} -d ${POSTGRES_DB:-avukat_list}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: avukat_adminer
    ports:
    - "8080:8080"
    depends_on:
    - postgres

volumes:
  pg_data: